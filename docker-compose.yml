version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: csrm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tiger
      MYSQL_DATABASE: csrm_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro

volumes:
  mysql_data:
